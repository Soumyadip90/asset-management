<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Asset Management</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #ebedef;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-card {
            background: #ffffff;
            padding: 35px 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 380px;
        }
        .login-logo {
            width: 44px;
            height: 44px;
            background: #321fdb;
            color: #fff;
            font-weight: 800;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px auto;
            font-size: 18px;
        }
        h2 {
            margin-top: 0;
            margin-bottom: 25px;
            text-align: center;
            color: #2f3542;
            font-size: 20px;
        }
        .form-group {
            margin-bottom: 18px;
        }
        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 6px;
            color: #4f5d73;
        }
        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #d8dbe0;
            border-radius: 4px;
            font-size: 14px;
            outline: none;
        }
        input:focus {
            border-color: #321fdb;
            box-shadow: 0 0 0 2px rgba(50, 31, 219, 0.15);
        }
        .btn-login {
            width: 100%;
            padding: 12px;
            background-color: #321fdb;
            border: none;
            border-radius: 4px;
            color: #ffffff;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 5px;
        }
        .btn-login:hover {
            background-color: #2819af;
        }
        .error-msg {
            color: #e55353;
            font-size: 13px;
            text-align: center;
            margin-top: 12px;
            display: none;
        }
    </style>
</head>
<body>

<div class="login-card">
    <div class="login-logo">SD</div>
    <h2>Asset Management Login</h2>
    <form id="loginForm">
        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" placeholder="Enter username" required autofocus>
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" placeholder="Enter password" required>
        </div>
        <button type="submit" class="btn-login">Sign In</button>
        <div id="errorMsg" class="error-msg">Invalid username or password.</div>
    </form>
</div>

<script>
    const VALID_USER = "admin";
    const VALID_PASS = "asset123";

    if (sessionStorage.getItem('isLoggedIn') === 'true') {
        window.location.replace('index.html');
    }

    document.getElementById('loginForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const userInput = document.getElementById('username').value.trim();
        const passInput = document.getElementById('password').value;
        const errorMsg = document.getElementById('errorMsg');

        if (userInput === VALID_USER && passInput === VALID_PASS) {
            sessionStorage.setItem('isLoggedIn', 'true');
            window.location.replace('index.html');
        } else {
            errorMsg.style.display = 'block';
        }
    });
</script>

</body>
</html>
